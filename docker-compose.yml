services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --project
        - backend
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')
      interval: 2s
      timeout: 3s
      retries: 10
    env_file:
      - path: .env
        required: false