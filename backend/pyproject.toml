[project]
name = "project-management-backend"
version = "0.1.0"
description = "FastAPI backend for the project management MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]